<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You are invited – Diwali (Desi)</title>
<meta name="description" content="Traditional Diwali invitation with an animated diya, mandala, toran and fireworks.">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="You are invited – Diwali (Desi)">
<meta property="og:description" content="Traditional Diwali invitation with an animated diya, mandala, toran and fireworks.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%AA%94%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="glow"></div><div class="mandala" id="mandala"></div><div id="toran"></div>
<main class="inv"><div class="inv-in" id="inv"></div></main>
<div class="diya" id="diya">
<svg viewBox="0 0 300 300" aria-label="A clay diya being lit with a matchstick" role="img">
 <defs>
  <radialGradient id="hg"><stop offset="0" stop-color="#ffb23a" stop-opacity=".9"/><stop offset=".4" stop-color="#ff7a00" stop-opacity=".3"/><stop offset="1" stop-color="#ff5a00" stop-opacity="0"/></radialGradient>
  <linearGradient id="fo" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff6a00"/><stop offset="1" stop-color="#ffd35a"/></linearGradient>
  <linearGradient id="st" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e2b068"/><stop offset="1" stop-color="#b5833a"/></linearGradient>
  <linearGradient id="clay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d6743a"/><stop offset=".6" stop-color="#a9461a"/><stop offset="1" stop-color="#6e270c"/></linearGradient>
  <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset=".5" stop-color="#d79a2b"/><stop offset="1" stop-color="#8a5a12"/></linearGradient>
 </defs>
 <circle id="halo" cx="150" cy="170" r="150" fill="url(#hg)"/>

 <ellipse cx="150" cy="272" rx="124" ry="22" fill="url(#brass)"/>
 <ellipse cx="150" cy="268" rx="104" ry="15" fill="#7a4a0d"/>
 <g fill="#ff9a1f"><circle cx="64" cy="268" r="8"/><circle cx="92" cy="278" r="8" fill="#ffc61a"/><circle cx="208" cy="278" r="8" fill="#ffc61a"/><circle cx="236" cy="268" r="8"/><circle cx="120" cy="283" r="7"/><circle cx="180" cy="283" r="7"/></g>
 <path d="M52 206Q150 184 248 206Q242 256 150 264Q58 256 52 206Z" fill="url(#clay)"/>
 <path d="M52 206Q28 200 14 180Q44 182 66 198Z" fill="#b4521f"/>
 <path d="M64 226Q150 246 236 226" stroke="#f6c453" stroke-width="3.5" fill="none"/>
 <g fill="#fff3d6"><circle cx="82" cy="236" r="2.8"/><circle cx="104" cy="241" r="2.8"/><circle cx="127" cy="244" r="2.8"/><circle cx="150" cy="245" r="3.4"/><circle cx="173" cy="244" r="2.8"/><circle cx="196" cy="241" r="2.8"/><circle cx="218" cy="236" r="2.8"/></g>
 <ellipse cx="150" cy="206" rx="98" ry="13" fill="#d9753a"/>
 <ellipse cx="150" cy="207" rx="89" ry="8.5" fill="#2a0e05"/>
 <rect x="147" y="194" width="6" height="18" rx="3" fill="#150808"/>
  <g id="flame"><g class="fl">
  <path d="M150 198C124 172 138 148 150 112C162 148 176 172 150 198Z" fill="url(#fo)"/>
  <path d="M150 196C140 180 146 166 150 148C154 166 160 180 150 196Z" fill="#fff8c8"/>
 </g></g>
 <g id="match">
  <rect x="-3.5" y="0" width="7" height="280" rx="3" fill="url(#st)"/>
  <circle cx="0" cy="0" r="8.5" fill="#b4201a"/><circle cx="0" cy="-1" r="5" fill="#e04a2a"/>
  <g id="spark" stroke="#ffe08a" stroke-width="2" stroke-linecap="round"><path d="M-14 -12l-8 -8M14 -12l8 -8M0 -18v-12M-18 0h-9M18 0h9"/></g>
  <g id="mflame"><path d="M0 0C-10 -12 -4 -24 0 -40C4 -24 10 -12 0 0Z" fill="url(#fo)"/><path d="M0 -1C-4 -8 -2 -14 0 -22C2 -14 4 -8 0 -1Z" fill="#fff8c8"/></g>
 </g>

</svg>
</div>
<canvas id="cv"></canvas>
<button id="replay" type="button">Replay</button>
<script src="script.js"></script>
</body>
</html>
